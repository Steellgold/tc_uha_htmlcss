<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accueil | Boutique LEGO® (non-)officielle FR </title>

  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/navbar.css">
  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/most-sell.css">
  <link rel="stylesheet" href="styles/promo.css">
  <link rel="stylesheet" href="styles/categories.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>
  <header style="width: 100%;">
    <div class="navbar">
      <img src="public/lego-logo.png" alt="LEGO® logo" class="logo">

      <div class="nav-links">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>

        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shopping-cart"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
      </div>
    </div>

    <div class="header">
      <img src="./public/lego-human-left.png" alt="LEGO® logo" class="left">

      <div class="header-content">
        <h1>À vos briques</h1>
        <p>libérez votre imagination</p>
      </div>

      <img src="./public/lego-human-right.png" alt="LEGO® logo" class="right">
    </div>
  </header>

  <div id="most-sell">
    <div id="title">
      <h2>Vous pourriez aimer</h2>
      <p>Basées sur nos produits les plus commandés et les plus appréciés</p>
    </div>

    <div id="items">
      <lego-item-card
        image="./public/items/2.png"
        price="29.99€"
        name="L’orchidée miniature"
        age="18+"
        bricks="274"
      ></lego-item-card>

      <lego-item-card
        image="./public/items/0.png"
        price="629.99€"
        name="La tour Eiffel"
        age="18+"
        bricks="10 001"
      ></lego-item-card>
      
      <lego-item-card
        image="./public/items/1.png"
        price="199.99€"
        name="La Moto Ducati Panigale V4 S"
        age="18+"
        bricks="1 603"
      ></lego-item-card>
      
      <lego-item-card
        image="./public/items/3.png"
        price="14.99€"
        name="Les amoureux"
        age="9+"
        bricks="287"
      ></lego-item-card>
      
      <lego-item-card
        image="./public/items/4.png"
        price="69.99€"
        name="Le chasseur ARC-170"
        age="9+"
        bricks="497"
      ></lego-item-card>
      
      <lego-item-card
        image="./public/items/5.png"
        price="49.99€"
        name="La balade en moto de Hagrid™ et Harry"
        age="9+"
        bricks="617"
      ></lego-item-card>
      
      <lego-item-card
        image="./public/items/6.png"
        price="79.99€"
        name="LOVE"
        age="18+"
        bricks="791"
      ></lego-item-card>
    </div>
  </div>

  <section id="valentine">
    <img src="./public/promo/valentine.png" alt="Promotion Saint-Valentin" class="promo-image">
    
    <div class="promo-content">
      <h2>Offrez-lui un cadeau inoubliable</h2>
      <p>À l'occasion de la Saint-Valentin, profitez de nos offres spéciales sur une sélection de produits</p>
    </div>
  </section>

  <section id="categories">
    <lego-item-category
      image="0"
      label="Nouveautées"
    ></lego-item-category>

    <lego-item-category
      image="1"
      label="Exclusivitées"
    ></lego-item-category>

    <lego-item-category
      image="2"
      label="Offres"
    ></lego-item-category>

    <lego-item-category
      image="3"
      label="Tout les jouets"
    ></lego-item-category>

    <lego-item-category
      image="4"
      label="18 ans et plus"
    ></lego-item-category>

    <lego-item-category
      image="5"
      label="Rechercher par prix"
    ></lego-item-category>

    <lego-item-category
      image="6"
      label="Saint-Valentin"
    ></lego-item-category>
  </section>

  <script src="public/scripts/lego-item-card.js"></script>
  <script src="public/scripts/lego-category-card.js"></script>
</body>
</html>
